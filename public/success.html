<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betaling Geslaagd | Kiyoh</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .message-container { max-width: 600px; margin: 100px auto; text-align: center; background: white; padding: 50px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .icon-success { font-size: 80px; color: var(--accent-green); margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="message-container">
    <div class="icon-success">✓</div>
    <h1>Bedankt voor je bestelling!</h1>
    <p class="mb-4">Je betaling is succesvol afgerond. We gaan direct voor je aan de slag. Je ontvangt zometeen een bevestiging per e-mail met meer informatie over het opzetten van je account.</p>
    <a href="https://kiyoh.com/tarieven" class="btn btn-primary mt-4">Terug naar Home</a>
  </div>
  <script>
    (function () {
      var PARENT_ORIGINS = ['https://kiyoh.com', 'https://www.kiyoh.com'];
      var params = new URLSearchParams(window.location.search);
      var orderId = params.get('orderId') || '';
      var tenant = params.get('tenant') || 'kiyoh';
      if (!orderId) return;

      var dedupeKey = 'kiyoh_ads_notified_' + orderId;
      try {
        if (sessionStorage.getItem(dedupeKey)) return;
      } catch (e) {}

      function postConversion(payload) {
        // When success loads inside the embed iframe, post straight to kiyoh.com.
        PARENT_ORIGINS.forEach(function (origin) {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(payload, origin);
          }
        });
        // Mollie opens in a popup whose opener is the payment iframe (same
        // origin). Target the opener with this origin so the iframe can relay
        // to kiyoh.com — posting with PARENT_ORIGINS here is dropped by the
        // browser because opener is payment.kiyoh.com, not www.kiyoh.com.
        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage(payload, window.location.origin);
          } catch (e) {}
        }
      }

      function notify(attempt) {
        var url = '/api/checkout-complete?orderId=' + encodeURIComponent(orderId) +
          '&tenant=' + encodeURIComponent(tenant);
        fetch(url).then(function (res) {
          if (res.status === 409 && attempt < 8) {
            setTimeout(function () { notify(attempt + 1); }, 750);
            return null;
          }
          if (!res.ok) return null;
          return res.json();
        }).then(function (data) {
          if (!data || !data.notify) return;
          var payload = {
            type: 'kiyoh_checkout_complete',
            package: data.package,
            language: data.language,
            value: data.value,
            currency: data.currency || 'EUR',
            orderId: data.orderId
          };
          postConversion(payload);
          try { sessionStorage.setItem(dedupeKey, '1'); } catch (e) {}
        }).catch(function () {
          if (attempt < 8) setTimeout(function () { notify(attempt + 1); }, 750);
        });
      }

      notify(0);
    })();
  </script>
</body>
</html>
