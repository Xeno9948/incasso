<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betaling Geslaagd | Kiyoh</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .message-container { max-width: 600px; margin: 100px auto; text-align: center; background: white; padding: 50px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .icon-success { font-size: 80px; color: var(--accent-green); margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="message-container">
    <div class="icon-success">✓</div>
    <h1>Bedankt voor je bestelling!</h1>
    <p class="mb-4">Je betaling is succesvol afgerond. We gaan direct voor je aan de slag. Je ontvangt zometeen een bevestiging per e-mail met meer informatie over het opzetten van je account.</p>
    <a href="https://kiyoh.com/tarieven" class="btn btn-primary mt-4">Terug naar Home</a>
  </div>
  <script>
    (function () {
      // Parents that embed this portal. The browser delivers the message
      // only to the one that actually framed us. Never '*'.
      var PARENT_ORIGINS = [
        'https://kiyoh.com',
        'https://www.kiyoh.com',
        'https://kiyoh-com-production.up.railway.app'
      ];
      // open/pending/authorized can still flip to paid. failed/canceled/expired must not.
      var RETRYABLE = { open: 1, pending: 1, authorized: 1 };
      var CHANNEL = 'kiyoh_checkout_complete';
      var params = new URLSearchParams(window.location.search);
      var orderId = params.get('orderId') || '';
      var tenant = params.get('tenant') || 'kiyoh';
      if (!orderId) return;

      var dedupeKey = 'kiyoh_ads_notified_' + orderId;
      function alreadySent() {
        try {
          if (sessionStorage.getItem(dedupeKey) === '1') return true;
          if (localStorage.getItem(dedupeKey) === '1') return true;
        } catch (e) {}
        return false;
      }
      function markSent() {
        try { sessionStorage.setItem(dedupeKey, '1'); } catch (e) {}
        try { localStorage.setItem(dedupeKey, '1'); } catch (e) {}
      }
      if (alreadySent()) return;

      var sent = false;

      function postConversion(payload) {
        // When success loads inside the embed iframe, post straight to the parent.
        PARENT_ORIGINS.forEach(function (origin) {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(payload, origin);
          }
        });
        // Mollie opens in a popup whose opener is the payment iframe (same
        // origin). Target the opener with this origin so the iframe can relay
        // to kiyoh.com — posting with PARENT_ORIGINS here is dropped by the
        // browser because opener is payment.kiyoh.com, not www.kiyoh.com.
        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage(payload, window.location.origin);
          } catch (e) {}
        }
        // Mollie may sever window.opener (COOP). The pricing iframe is still
        // same-origin and listening, so this reaches it without a wildcard origin.
        try {
          var bc = new BroadcastChannel(CHANNEL);
          bc.postMessage(payload);
          bc.close();
        } catch (e) {}
      }

      function notify(attempt) {
        if (sent || alreadySent()) return;
        var url = '/api/checkout-complete?orderId=' + encodeURIComponent(orderId) +
          '&tenant=' + encodeURIComponent(tenant);
        fetch(url, { cache: 'no-store' }).then(function (res) {
          if (res.status === 409) {
            return res.json().then(function (body) {
              var status = body && body.status;
              if (RETRYABLE[status] && attempt < 8) {
                setTimeout(function () { notify(attempt + 1); }, 750);
              }
              return null;
            }).catch(function () { return null; });
          }
          if (!res.ok) return null;
          return res.json();
        }).then(function (data) {
          if (sent || alreadySent()) return;
          if (!data) return;
          // Paid, but not a storefront package checkout (sales link, invoice).
          if (!data.notify) {
            markSent();
            return;
          }
          // value is the ex-VAT yearly total from the API, already a number.
          var payload = {
            type: 'kiyoh_checkout_complete',
            package: data.package,
            language: data.language,
            value: data.value,
            currency: data.currency || 'EUR',
            orderId: data.orderId
          };
          if (data.email) payload.email = data.email;
          sent = true;
          markSent();
          postConversion(payload);
        }).catch(function () {
          if (!sent && attempt < 8) setTimeout(function () { notify(attempt + 1); }, 750);
        });
      }

      notify(0);
    })();
  </script>
</body>
</html>
